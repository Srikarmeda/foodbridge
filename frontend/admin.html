<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin | FoodBridge</title>
  <meta name="theme-color" content="#1F7A4D" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌉</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <noscript><p class="container" style="padding:1rem">FoodBridge needs JavaScript to run. Please enable it.</p></noscript>
  <main id="main" class="page container stack" style="--stack:var(--space-6)">
    <div class="page-header">
      <div>
        <h1>Admin dashboard</h1>
        <p class="text-muted" style="margin:var(--space-2) 0 0">Platform health, users and listing moderation.</p>
      </div>
      <button class="btn btn-secondary" id="refresh" type="button"><span data-icon="refresh" data-size="18"></span>Refresh</button>
    </div>

    <section aria-label="Platform stats"><div class="stats-row" id="stats"></div></section>

    <section aria-label="Manage platform data">
      <div class="tabs" id="tabs" role="tablist" aria-label="Admin sections"></div>

      <div id="panel-listings" role="tabpanel" aria-labelledby="tab-listings">
        <div class="admin-bar">
          <div class="field"><label class="label" for="l-q">Search listings</label><input class="input" id="l-q" type="search" placeholder="Title or donor" maxlength="60" autocomplete="off" /></div>
          <div class="field"><label class="label" for="l-status">Status</label>
            <select class="select" id="l-status"><option value="">All statuses</option><option value="AVAILABLE">Available</option><option value="CLAIMED">Claimed</option><option value="PICKED_UP">Picked up</option><option value="COMPLETED">Completed</option><option value="EXPIRED">Expired</option></select></div>
        </div>
        <p class="text-sm text-muted" id="l-count" aria-live="polite" style="margin:0 0 var(--space-3)"></p>
        <div id="listings-table"></div>
      </div>

      <div id="panel-users" role="tabpanel" aria-labelledby="tab-users" hidden>
        <div class="admin-bar">
          <div class="field"><label class="label" for="u-q">Search users</label><input class="input" id="u-q" type="search" placeholder="Name, email or organisation" maxlength="60" autocomplete="off" /></div>
          <div class="field"><label class="label" for="u-role">Role</label>
            <select class="select" id="u-role"><option value="">All roles</option><option value="DONOR">Donors</option><option value="RECEIVER">Receivers</option><option value="ADMIN">Admins</option></select></div>
        </div>
        <p class="text-sm text-muted" id="u-count" aria-live="polite" style="margin:0 0 var(--space-3)"></p>
        <div id="users-table"></div>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script type="module" src="js/pages/admin.js"></script>
</body>
</html>
