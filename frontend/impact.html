<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Our impact | FoodBridge</title>
  <meta name="theme-color" content="#1F7A4D" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌉</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <noscript><p class="container" style="padding:1rem">FoodBridge needs JavaScript to run. Please enable it.</p></noscript>
  <main id="main">
    <section class="impact-hero">
      <div class="container">
        <span class="hero__eyebrow"><span data-icon="leaf" data-size="16"></span>Community impact</span>
        <h1>Every rescued meal counts</h1>
        <p>Totals from handovers confirmed by donors on FoodBridge. Meal and CO₂e figures are estimates.</p>
      </div>
    </section>
    <div class="container page stack" style="--stack:var(--space-6)">
      <section aria-label="Platform totals"><div class="big-stats" id="totals"></div></section>
      <p class="text-sm text-muted" id="assumptions" style="margin:0"></p>
      <section aria-labelledby="lb-title">
        <div class="section-title">
          <h2 id="lb-title">Donor leaderboard</h2>
          <span class="text-sm text-muted">Ranked by food rescued (kg)</span>
        </div>
        <div id="board" aria-live="polite"></div>
      </section>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script type="module" src="js/pages/impact.js"></script>
</body>
</html>
