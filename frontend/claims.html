<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My claims | FoodBridge</title>
  <meta name="theme-color" content="#1F7A4D" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌉</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <noscript><p class="container" style="padding:1rem">FoodBridge needs JavaScript to run. Please enable it.</p></noscript>
  <main id="main" class="page container stack" style="--stack:var(--space-6)">
    <div class="page-header">
      <div>
        <h1>My claims</h1>
        <p class="text-muted" style="margin:var(--space-2) 0 0">Pick up your food on time and track every rescue.</p>
      </div>
      <a class="btn btn-primary btn-lg" href="browse.html"><span data-icon="search" data-size="20"></span>Find more food</a>
    </div>
    <div class="alert alert--success" id="banner" role="status" hidden></div>
    <section aria-label="Your impact"><div class="stats-row" id="stats"></div></section>
    <section aria-labelledby="claims-title">
      <div class="section-title">
        <h2 id="claims-title">Your claims</h2>
        <div class="segmented" id="tabs" role="group" aria-label="Filter claims"></div>
      </div>
      <div id="list" aria-live="polite"></div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script type="module" src="js/pages/claims.js"></script>
</body>
</html>
